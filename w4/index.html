<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <style>
    /* ==========================================
       1. 全局變數與色彩設定 (馬卡龍藍色系)
       方便後續調整顏色與視覺風格
       ========================================== */
    :root {
      /* 主配色：馬卡龍藍（柔和薄荷藍/天空藍） */
      --macaron-blue-light: #e0f2fe;  /* 極淺背景藍 */
      --macaron-blue-main: #a5f3fc;   /* 馬卡龍主色藍 */
      --macaron-blue-accent: #38bdf8; /* 強調亮藍色 */
      --macaron-blue-dark: #0284c7;   /* 深色文字與邊框藍 */
      
      /* 卡片與背景設定 */
      --bg-color: #f0f9ff;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #334155;
      --text-muted: #64748b;
      
      /* 高亮 (Highlight) 特效顏色設定 */
      --highlight-glow: 0 10px 25px -5px rgba(56, 189, 248, 0.6), 0 8px 10px -6px rgba(56, 189, 248, 0.4);
      --highlight-border: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      /* 柔和背景漸層 */
      background-image: radial-gradient(var(--macaron-blue-main) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--macaron-blue-dark);
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* ==========================================
       2. 載入中動畫 (Cool Loading Animation)
       ========================================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid var(--macaron-blue-light);
      border-top: 5px solid var(--macaron-blue-accent);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--macaron-blue-dark);
      letter-spacing: 2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-grid {
      /* RWD 欄位數量控制 */
      column-count: 1;
      column-gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    /* 螢幕寬度響應式調整 */
    @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }

    .masonry-grid.loaded {
      opacity: 1;
    }

    /* ==========================================
       4. 留言卡片與亮起 (Highlight) 動效
       ========================================== */
    .message-card {
      break-inside: avoid; /* 防止卡片被跨欄截斷 */
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 2px solid var(--macaron-blue-light);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      
      /* 轉場動畫關鍵設定 */
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.5s ease,
                  border-color 0.5s ease,
                  filter 0.5s ease,
                  opacity 0.5s ease;
      cursor: pointer;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 1px dashed var(--macaron-blue-main);
      padding-bottom: 0.5rem;
    }

    .author-name {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--macaron-blue-dark);
    }

    .time-stamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .message-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap; /* 保留留言換行 */
      word-break: break-word;
    }

    /* ----- 高亮特效狀態 (Highlight) ----- */
    .message-card.highlight {
      transform: scale(1.08); /* 卡片放大 */
      border-color: var(--highlight-border); /* 邊框變亮 */
      box-shadow: var(--highlight-glow); /* 產生光暈效果 */
      background: #ffffff;
      z-index: 10;
      position: relative;
    }

    /* ----- 非焦點卡片變暗變模糊 ----- */
    .masonry-grid.has-highlight .message-card:not(.highlight) {
      filter: blur(1.5px) grayscale(20%); /* 輕微模糊與灰階 */
      opacity: 0.5; /* 降低透明度 */
      transform: scale(0.96); /* 稍微縮小 */
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 朋友對我的動態留言板 ✨</h1>
    <p>正在自動輪播來自朋友的溫馨悄悄話...</p>
  </header>

  <!-- 讀取中酷炫動畫 -->
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流留言卡片容器 -->
  <div id="wall" class="masonry-grid"></div>

  <script>
    /* ==========================================
       5. 控制參數設定 (可自行修改)
       ========================================== */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxrsCwLUJFthjB36EkbuHs5B-JaQIM8ckpDhGtEcTFbKMkzjxgtr1zXkgNSXw2n-Wtb4JeYdYEIIMj/pub?output=csv';
    
    // 【輪播秒數設定】這裡可以調整卡片切換的時間 (單位: 毫秒，3000 = 3秒)
    const ROTATE_INTERVAL_MS = 3000; 

    let cardsData = [];
    let currentIndex = -1;
    let rotateTimer = null;

    /* ==========================================
       6. CSV 解析函式 (安全處理內容包含逗號與換行)
       ========================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let currentToken = '';

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i + 1];

        if (c === '"') {
          if (inQuotes && nextC === '"') {
            currentToken += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push(currentToken.trim());
          currentToken = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && nextC === '\n') { i++; }
          row.push(currentToken.trim());
          if (row.length > 1 || row[0] !== '') lines.push(row);
          row = [];
          currentToken = '';
        } else {
          currentToken += c;
        }
      }
      if (currentToken || row.length > 0) {
        row.push(currentToken.trim());
        lines.push(row);
      }
      return lines;
    }

    /* ==========================================
       7. 取得與處理 Google 試算表資料
       ========================================== */
    async function fetchMessages() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路回應不正常');
        
        const rawCSV = await response.text();
        const parsedRows = parseCSV(rawCSV);

        // 排除第一列 (標題列：時間戳記、名字、悄悄話)
        const dataRows = parsedRows.slice(1);

        cardsData = dataRows.map(row => {
          return {
            timestamp: row[0] || '未知時間',
            name: row[1] || '匿名朋友',
            message: row[2] || '（這個人什麼都沒寫～）'
          };
        });

        renderWall(cardsData);
      } catch (error) {
        console.error('抓取資料失敗:', error);
        document.getElementById('loading-container').innerHTML = `
          <div style="color: #ef4444; text-align: center;">
            <p>❌ 留言讀取失敗，請稍微再試一次。</p>
          </div>
        `;
      }
    }

    /* ==========================================
       8. 動態繪製卡片畫面
       ========================================== */
    function renderWall(messages) {
      const wall = document.getElementById('wall');
      const loading = document.getElementById('loading-container');
      
      wall.innerHTML = '';

      messages.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'message-card';
        card.dataset.index = index;

        // 格式化顯示時間
        const formattedTime = item.timestamp.split(' ')[0] || item.timestamp;

        card.innerHTML = `
          <div class="card-header">
            <span class="author-name"> ${escapeHTML(item.name)}</span>
            <span class="time-stamp">${escapeHTML(formattedTime)}</span>
          </div>
          <div class="message-content">${escapeHTML(item.message)}</div>
        `;

        // 點擊卡片時可手動聚焦該張卡片
        card.addEventListener('click', () => {
          highlightCard(index);
          resetTimer();
        });

        wall.appendChild(card);
      });

      // 隱藏 Loading 動畫並顯示瀑布流
      loading.style.display = 'none';
      wall.classList.add('loaded');

      // 開始輪播動畫
      if (messages.length > 0) {
        highlightCard(0);
        startRotation();
      }
    }

    /* ==========================================
       9. 輪播高亮特效控制 (Highlight Logic)
       ========================================== */
    function highlightCard(index) {
      const wall = document.getElementById('wall');
      const cards = document.querySelectorAll('.message-card');
      
      if (cards.length === 0) return;

      cards.forEach(card => card.classList.remove('highlight'));

      // 加入背景模糊特性的 class
      wall.classList.add('has-highlight');

      // 啟用當前目標卡片高亮
      const targetCard = cards[index];
      if (targetCard) {
        targetCard.classList.add('highlight');
        
        // 確保視窗能夠平滑滾動到高亮卡片附近（若牆面很長時體驗更好）
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      currentIndex = index;
    }

    function nextCard() {
      if (cardsData.length === 0) return;
      const nextIndex = (currentIndex + 1) % cardsData.length;
      highlightCard(nextIndex);
    }

    function startRotation() {
      stopRotation();
      // 使用上方設定好的 ROTATE_INTERVAL_MS 來控制輪播頻率
      rotateTimer = setInterval(nextCard, ROTATE_INTERVAL_MS);
    }

    function stopRotation() {
      if (rotateTimer) clearInterval(rotateTimer);
    }

    function resetTimer() {
      stopRotation();
      startRotation();
    }

    /* 工具函式：防範 XSS 攻擊的文字轉義 */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // 頁面載入後自動執行
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
